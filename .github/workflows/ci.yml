name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}${{ matrix.ollama && ', with Ollama' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full suite: the retrieval/trust tests need real embeddings.
          - os: ubuntu-latest
            ollama: true
          # Installer/hook paths on macOS; embedding tests skip with a reason.
          - os: macos-latest
            ollama: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-python's macOS build has sqlite extension loading compiled out —
      # exactly the machine install.py must cope with by finding Homebrew's.
      - name: Ensure a Homebrew python3 (macOS)
        if: runner.os == 'macOS'
        run: test -x /opt/homebrew/bin/python3 || brew install python

      # Bootstrap .venv exactly the way install.py does, so CI also proves the
      # interpreter selection + pip reconcile path a fresh clone goes through.
      - name: Bootstrap .venv via the installer
        # Load scripts/install/venv.py by path: `import venv` would be the
        # stdlib module if the search path ever changed.
        run: |
          python -c "import importlib.util as u,pathlib; s=u.spec_from_file_location('hera_venv','scripts/install/venv.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.ensure_venv(pathlib.Path('.').resolve()))"

      - name: Install Ollama + nomic-embed-text
        if: matrix.ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/version; then
            (ollama serve > /tmp/ollama.log 2>&1 &)   # no systemd service on this runner
          fi
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version && break
            [ "$i" = 60 ] && { echo "ollama never came up"; cat /tmp/ollama.log 2>/dev/null; exit 1; }
            sleep 1
          done
          ollama pull nomic-embed-text

      - name: pytest
        env:
          HERA_REQUIRE_OLLAMA: ${{ matrix.ollama && '1' || '0' }}
        run: .venv/bin/python -m pytest -q -ra

      - name: Docs consistency
        run: |
          bash scripts/check_doc_links.sh
          bash scripts/check_docs_consistency.sh
